name: Build image

# Builds the production image for a chosen tag and platform (arm64 by
# default, for ARM-based Fargate) and pushes it to the deployment's
# container registry (Amazon ECR). Manual only: nothing is built or
# deployed automatically. Deploying the image is a separate,
# manual step outside this repository.
#
# Registry, region and the IAM role come from repository variables and
# secrets so this file carries no account details.
#
# Required repository configuration:
#   secrets.AWS_ROLE_TO_ASSUME  IAM role ARN trusted by GitHub's OIDC provider
#   vars.AWS_REGION             e.g. us-west-2
#   vars.ECR_REPOSITORY         repository name inside the registry
#
# Build tags look like v2.17.0-custom.1: the upstream release the code is
# based on, then a build counter. Each run produces one immutable image tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Build tag to build (e.g. v2.17.0-custom.1)'
        required: true
        type: string
      platform:
        description: 'Target platform'
        required: true
        default: linux/arm64
        type: choice
        options:
          - linux/arm64
          - linux/amd64

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-image-${{ inputs.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build_and_push:
    name: Build and push
    # Native runner per platform: no emulation, so the arm64 build (the
    # default, for ARM-based Fargate) runs at full speed.
    runs-on: ${{ inputs.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-tags: true

      - name: Resolve image tags
        id: meta
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          BUILD_TAG="$(git name-rev --tags --name-only "$GIT_SHA" | head -n 1 | sed 's/\^0//')"

          if [ -z "$BUILD_TAG" ] || [ "$BUILD_TAG" = "undefined" ]; then
            BUILD_TAG="sha-${GIT_SHA::12}"
          fi

          echo "sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "Building $BUILD_TAG ($GIT_SHA)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ inputs.platform }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.build_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.platform }}

      - name: Summary
        run: |
          {
            echo "### Image pushed (${{ inputs.platform }})"
            echo
            echo '```'
            echo "${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.build_tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
