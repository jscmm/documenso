name: 'Setup node'
inputs:
  node_version:
    required: false
    default: v24.x

runs:
  using: 'composite'
  steps:
    - name: Set up Node ${{ inputs.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Enable corepack
      shell: bash
      run: corepack enable npm

    - name: Install dependencies
      shell: bash
      run: |
        npm ci --no-audit
        npm run prisma:generate
      env:
        HUSKY: '0'
        # Browsers are installed explicitly by the jobs that need them (`npx playwright
        # install`). The postinstall download fails on runner images Playwright does not
        # know yet, such as ubuntu26.04.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
